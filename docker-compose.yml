services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      REDIS_ADDR: redis:6379
      CACHE_TTL: 30s
      CACHE_TTL_JITTER: 10s
      # Simulated "database" latency for the in-memory store, see
      # internal/store/memory.go for why this isn't a real Postgres.
      STORE_LATENCY_MS: 80
      STORE_JITTER_MS: 40
    depends_on:
      redis:
        condition: service_healthy
    # No container-level healthcheck here: the image is distroless (no
    # shell, no curl/wget available to run one from inside). scripts/simulate.sh
    # polls GET /healthz from the host instead once the container is up.
